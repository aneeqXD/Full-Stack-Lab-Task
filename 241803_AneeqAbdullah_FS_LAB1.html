<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #1c1c1c;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .display {
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            text-align: right;
            font-size: 32px;
            color: #ffffff;
            background: #2a2a2a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            background: #2f2f2f;
            color: #ffffff;
            transition: 0.2s;
        }

            button:hover {
                background: #3a3a3a;
            }

            button:active {
                transform: scale(0.95);
            }

        .operator {
            background: #ff9500;
            color: white;
        }

            .operator:hover {
                background: #e08900;
            }

        .function {
            background: #a5a5a5;
            color: black;
        }

            .function:hover {
                background: #8d8d8d;
            }

        .equals {
            background: #ff9500;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="display">0</div>

        <div class="buttons">
            <button class="function">AC</button>
            <button class="function">DEL</button>
            <button class="function">%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button class="zero">0</button>
            <button>.</button>
            <button class="equals">=</button>
        </div>

    </div>

</body>
</html>
